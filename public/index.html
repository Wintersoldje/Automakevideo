<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>NEWNEEK 자동 생성 콘솔</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="container">
      <header>
        <h1>NEWNEEK 데일리 자동 생성</h1>
        <p>Gmail의 NEWNEEK 데일리를 읽고 대본, 음성, 이미지, 자막을 생성합니다.</p>
      </header>

      <section class="panel">
        <div class="button-row">
          <button id="generateScript">대본 생성</button>
          <button id="downloadScripts" disabled>대본 TXT 저장</button>
          <button id="renderShort" disabled>숏폼 MP4 저장</button>
          <button id="renderLong" disabled>롱폼 MP4 저장</button>
        </div>

        <div class="status" id="statusMessage">대본 생성 버튼을 눌러 시작하세요.</div>

        <div class="grid">
          <div class="card">
            <h2>숏폼 대본</h2>
            <textarea id="shortScript" rows="10" readonly></textarea>
            <h3>숏폼 자막 라인</h3>
            <textarea id="shortCaptions" rows="6" readonly></textarea>
          </div>
          <div class="card">
            <h2>롱폼 대본</h2>
            <textarea id="longScript" rows="12" readonly></textarea>
            <h3>롱폼 자막 라인</h3>
            <textarea id="longCaptions" rows="8" readonly></textarea>
          </div>
        </div>
      </section>
    </main>

    <script src="app.js"></script>
  </body>
</html>
