<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>NEWNEEK 자동화 영상 생성</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="container">
      <header>
        <h1>NEWNEEK 뉴스 요약 영상 자동화</h1>
        <p>
          오늘의 NEWNEEK 메일을 요약해 숏폼과 롱폼 대본을 만들고
          파일로 저장합니다
        </p>
      </header>

      <section class="panel">
        <div class="button-row">
          <button id="generateScript">대본 txt 파일 생성</button>
          <button id="saveScript" disabled>대본 txt 저장</button>
        </div>

        <div class="script-grid">
          <div class="script-card">
            <h2>숏폼 대본</h2>
            <textarea id="shortScript" rows="10" readonly></textarea>
          </div>
          <div class="script-card">
            <h2>롱폼 대본</h2>
            <textarea id="longScript" rows="14" readonly></textarea>
          </div>
        </div>

        <div class="button-row">
          <button id="saveShortVideo" disabled>숏폼 영상 mp4 저장</button>
          <button id="saveLongVideo" disabled>롱폼 영상 mp4 저장</button>
        </div>
      </section>
    </main>

    <script src="script.js"></script>
  </body>
</html>
